name: Atualizar índice

on:
  push:
    branches: [main]
    paths: ["dsmm/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indice
  cancel-in-progress: false

jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/gerar_indice.py
      - name: Commit do índice
        run: |
          if git diff --quiet README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: atualiza índice"
          git pull --rebase
          git push
